---
name: Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Lint YAML and Python
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install development dependencies
        run: pip install -r requirements-dev.txt

      - name: Run yamllint
        run: |
          yamllint -c .yamllint.yml .

      - name: Check Python formatting
        run: black --check filter_plugins tests

      - name: Run flake8
        run: flake8 filter_plugins tests

      - name: Run mypy
        run: mypy filter_plugins tests
